name: fuelmix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fuelmix}
      FUELMIX_MIGRATOR_PASSWORD: ${FUELMIX_MIGRATOR_PASSWORD:-migrator}
      FUELMIX_INGEST_PASSWORD: ${FUELMIX_INGEST_PASSWORD:-ingest}
      FUELMIX_REPORT_PASSWORD: ${FUELMIX_REPORT_PASSWORD:-report}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-fuelmix}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        PROJECT: src/FuelMix.Worker/FuelMix.Worker.csproj
        ENTRYPOINT_DLL: FuelMix.Worker.dll
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Migrator: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-fuelmix};Username=fuelmix_migrator;Password=${FUELMIX_MIGRATOR_PASSWORD:-migrator}"
      ConnectionStrings__Ingest: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-fuelmix};Username=fuelmix_ingest;Password=${FUELMIX_INGEST_PASSWORD:-ingest}"
      Ingest__IntervalSeconds: ${INGEST_INTERVAL_SECONDS:-300}
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        PROJECT: src/FuelMix.Api/FuelMix.Api.csproj
        ENTRYPOINT_DLL: FuelMix.Api.dll
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Report: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-fuelmix};Username=fuelmix_report;Password=${FUELMIX_REPORT_PASSWORD:-report}"
      Auth__ApiKey: ${FUELMIX_API_KEY:-dev-api-key}
    restart: unless-stopped

volumes:
  pgdata:
